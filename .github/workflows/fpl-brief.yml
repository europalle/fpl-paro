name: FPL daily brief

on:
  # PRIMARY TRIGGER: an external cron service POSTs to this workflow's
  # dispatches endpoint once a day. API-dispatched runs start immediately
  # instead of queueing behind GitHub's scheduled work, which is what kept
  # arriving late or not at all.
  workflow_dispatch:

  # BACKSTOP ONLY. GitHub's own scheduler is best effort and drifts badly under
  # load, so these are not relied on, they are just free insurance in case the
  # external trigger is the thing that breaks. The commit step is idempotent,
  # so a duplicate run costs nothing: it either commits a fresher brief or
  # exits saying there was nothing to change.
  #
  # Odd minutes on purpose. :00, :15, :30 and :45 are the most contended slots.
  schedule:
    - cron: "7 12 * * *"
    - cron: "7 14 * * *"

permissions:
  contents: write

concurrency:
  group: fpl-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history. The default shallow clone cannot rebase, so a push
          # that loses a race with a human commit fails with no way to recover.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate brief
        run: |
          echo "Triggered by: ${GITHUB_EVENT_NAME} at $(date -u +%H:%M) UTC"
          mkdir -p briefs
          python3 fpl_brief.py \
            --entry 8876628 \
            --league 1840250 \
            --out "briefs/brief-{date}.md"

      - name: Commit brief
        run: |
          set -euo pipefail
          git config user.name  "fpl-brief bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRIEF="$(ls briefs/brief-*.md | sort | tail -1)"
          echo "Generated: ${BRIEF}"
          cp "${BRIEF}" "${RUNNER_TEMP}/brief.md"

          # Rebasing is the wrong tool here. The brief is regenerated output, so
          # on a clash the fresh copy simply wins, and there is nothing to merge.
          # Reset hard onto whatever main looks like now, drop the new brief on
          # top, and commit that. This can never conflict and can never revert
          # somebody else's commit, because we take their tree wholesale and
          # only add our one generated file to it.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            mkdir -p briefs
            cp "${RUNNER_TEMP}/brief.md" "${BRIEF}"
            git add briefs/

            if git diff --staged --quiet; then
              echo "Brief is identical to the one already on main, nothing to commit."
              exit 0
            fi

            git commit --quiet -m "FPL brief $(date -u +%Y-%m-%d)"

            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push lost a race on attempt ${attempt}, retrying against new main."
          done

          echo "Push still failing after 3 attempts. Brief was generated but not saved."
          exit 1
